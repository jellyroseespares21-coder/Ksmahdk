
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

<div class="form-container">

    <div class="logo">🔹</div>

    <h2 id="formTitle">Welcome Back!</h2>
    <p class="subtitle" id="formSubtitle">Login to your account</p>

    <form id="authForm">

        <label for="email">Email Address</label>
        <input type="email" id="email"
            placeholder="Enter your email"
            autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password"
            placeholder="Enter your password"
            minlength="6" required>

        <div class="show-password">
            <input type="checkbox" id="showPassword">
            <label for="showPassword">Show Password</label>
        </div>

        <div id="confirmGroup" class="hidden">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6">
            <p id="passwordMatchMessage"></p>
        </div>

        <p id="errorMessage" role="alert"></p>

        <button type="submit" id="submitButton">Login</button>

        <p class="toggle-text" id="toggleText">
            Don't have an account?
            <a href="#" id="toggleLink">Sign Up</a>
        </p>

    </form>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


// FIREBASE CONFIGURATION
// Replace these values with your actual Firebase config.

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


// HTML ELEMENTS
const authForm = document.getElementById("authForm");
const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");

const email = document.getElementById("email");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const confirmGroup = document.getElementById("confirmGroup");
const showPassword = document.getElementById("showPassword");

const submitButton = document.getElementById("submitButton");
const toggleText = document.getElementById("toggleText");

const errorMessage = document.getElementById("errorMessage");
const passwordMatchMessage =
    document.getElementById("passwordMatchMessage");

let isLogin = true;


// ALREADY LOGGED IN
onAuthStateChanged(auth, (user) => {
    if (user) {
        window.location.replace("./index.html");
    }
});


// CLEAR MESSAGES
function clearMessages() {
    errorMessage.textContent = "";
    passwordMatchMessage.textContent = "";
    passwordMatchMessage.className = "";
}


// LOGIN / SIGN UP SWITCH
function toggleForm(event) {

    if (event) event.preventDefault();

    isLogin = !isLogin;

    authForm.reset();
    clearMessages();

    showPassword.checked = false;
    password.type = "password";
    confirmPassword.type = "password";

    if (isLogin) {

        formTitle.textContent = "Welcome Back!";
        formSubtitle.textContent = "Login to your account";

        confirmGroup.classList.add("hidden");
        confirmPassword.required = false;
        confirmPassword.disabled = true;

        submitButton.textContent = "Login";

        toggleText.innerHTML =
            `Don't have an account?
             <a href="#" id="toggleLink">Sign Up</a>`;

    } else {

        formTitle.textContent = "Create Account";
        formSubtitle.textContent = "Sign up to get started";

        confirmGroup.classList.remove("hidden");
        confirmPassword.required = true;
        confirmPassword.disabled = false;

        submitButton.textContent = "Sign Up";

        toggleText.innerHTML =
            `Already have an account?
             <a href="#" id="toggleLink">Login</a>`;

    }
}


// TOGGLE LINK
toggleText.addEventListener("click", function(event) {
    if (event.target.id === "toggleLink") {
        toggleForm(event);
    }
});


// SHOW PASSWORD
showPassword.addEventListener("change", function() {

    const type = this.checked ? "text" : "password";

    password.type = type;
    confirmPassword.type = type;

});


// PASSWORD MATCH
function checkPasswordMatch() {

    if (!confirmPassword.value) {

        passwordMatchMessage.textContent = "";
        passwordMatchMessage.className = "";

    } else if (password.value === confirmPassword.value) {

        passwordMatchMessage.textContent = "Passwords match!";
        passwordMatchMessage.className = "success-message";

    } else {

        passwordMatchMessage.textContent =
            "Passwords do not match.";

        passwordMatchMessage.className = "error-message";

    }

}

password.addEventListener("input", checkPasswordMatch);
confirmPassword.addEventListener("input", checkPasswordMatch);


// LOGIN AND SIGN UP
authForm.addEventListener("submit", async function(event) {

    event.preventDefault();
    clearMessages();

    const userEmail = email.value.trim();
    const userPassword = password.value;

    if (userPassword.length < 6) {
        errorMessage.textContent =
            "Password must contain at least 6 characters.";
        return;
    }

    if (!isLogin &&
        userPassword !== confirmPassword.value) {

        errorMessage.textContent = "Passwords do not match.";
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Please wait...";

    try {

        if (!isLogin) {

            // CREATE NEW ACCOUNT
            await createUserWithEmailAndPassword(
                auth,
                userEmail,
                userPassword
            );

            alert("Account created successfully!");

            // OPEN WEBSITE
            window.location.replace("./index.html");

        } else {

            // LOGIN EXISTING ACCOUNT
            await signInWithEmailAndPassword(
                auth,
                userEmail,
                userPassword
            );

            alert("Welcome! Successfully logged in.");

            // OPEN WEBSITE
            window.location.replace("./index.html");

        }

    } catch (error) {

        switch (error.code) {

            case "auth/email-already-in-use":
                errorMessage.textContent =
                    "Email already registered. Please login.";
                break;

            case "auth/invalid-email":
                errorMessage.textContent =
                    "Please enter a valid email.";
                break;

            case "auth/weak-password":
                errorMessage.textContent =
                    "Password must be at least 6 characters.";
                break;

            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":
                errorMessage.textContent =
                    "Incorrect email or password.";
                break;

            case "auth/network-request-failed":
                errorMessage.textContent =
                    "Please check your internet connection.";
                break;

            default:
                errorMessage.textContent = error.message;

        }

    } finally {

        submitButton.disabled = false;
        submitButton.textContent = isLogin ? "Login" : "Sign Up";

    }

});

</script>

</body>
</html>
