<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

    <div class="form-container">
        <div class="logo">🔹</div>
        <h2 id="formTitle">Welcome Back!</h2>
        <p class="subtitle" id="formSubtitle">Login to your account</p>

        <form id="authForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                minlength="4"
            >

            <div class="show-password">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Show Password</label>
            </div>

            <div id="confirmGroup" class="hidden">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="4"
                >
                <p id="passwordMatchMessage"></p>
            </div>

            <p id="errorMessage" role="alert"></p>

            <button type="submit" id="submitButton">Login</button>

            <p class="toggle-text" id="toggleText">
                Don't have an account?
                <a href="#" id="toggleLink">Sign Up</a>
            </p>
        </form>
    </div>

    <script>
          
const authForm = document.getElementById("authForm");
const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");
const username = document.getElementById("username");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const confirmGroup = document.getElementById("confirmGroup");
const showPassword = document.getElementById("showPassword");
const submitButton = document.getElementById("submitButton");
const toggleText = document.getElementById("toggleText");
const errorMessage = document.getElementById("errorMessage");
const passwordMatchMessage = document.getElementById("passwordMatchMessage");

let isLogin = true;

// Initial settings
confirmPassword.disabled = true;

function clearMessages() {
    errorMessage.textContent = "";
    passwordMatchMessage.textContent = "";
    passwordMatchMessage.className = "";
}

function toggleForm(event) {
    if (event) event.preventDefault();

    isLogin = !isLogin;

    authForm.reset();
    clearMessages();

    showPassword.checked = false;
    password.type = "password";
    confirmPassword.type = "password";

    if (isLogin) {
        formTitle.textContent = "Welcome Back!";
        formSubtitle.textContent = "Login to your account";

        confirmGroup.classList.add("hidden");
        confirmPassword.required = false;
        confirmPassword.disabled = true;

        password.autocomplete = "current-password";
        submitButton.textContent = "Login";

        toggleText.innerHTML =
            `Don't have an account? <a href="#" id="toggleLink">Sign Up</a>`;

    } else {
        formTitle.textContent = "Create Account";
        formSubtitle.textContent = "Sign up to get started";

        confirmGroup.classList.remove("hidden");
        confirmPassword.required = true;
        confirmPassword.disabled = false;

        password.autocomplete = "new-password";
        submitButton.textContent = "Sign Up";

        toggleText.innerHTML =
            `Already have an account? <a href="#" id="toggleLink">Login</a>`;
    }

    document.getElementById("toggleLink")
        .addEventListener("click", toggleForm);
}

document.getElementById("toggleLink")
    .addEventListener("click", toggleForm);

// Show Password
showPassword.addEventListener("change", function () {
    const type = this.checked ? "text" : "password";

    password.type = type;
    confirmPassword.type = type;
});

// Check Password Match
function checkPasswordMatch() {
    if (!confirmPassword.value) {
        passwordMatchMessage.textContent = "";
        passwordMatchMessage.className = "";
    } else if (password.value === confirmPassword.value) {
        passwordMatchMessage.textContent = "Passwords match!";
        passwordMatchMessage.className = "success-message";
    } else {
        passwordMatchMessage.textContent = "Passwords do not match.";
        passwordMatchMessage.className = "error-message";
    }
}

password.addEventListener("input", checkPasswordMatch);
confirmPassword.addEventListener("input", checkPasswordMatch);

// LOGIN AND SIGN UP
authForm.addEventListener("submit", function (event) {
    event.preventDefault();
    clearMessages();

    const user = username.value.trim();
    const pass = password.value;

    if (!user || !pass) {
        errorMessage.textContent = "Please fill in all required fields.";
        return;
    }

    if (pass.length < 4) {
        errorMessage.textContent = "Password must be at least 4 characters.";
        return;
    }

    // SIGN UP
    if (!isLogin) {
        const confirm = confirmPassword.value;

        if (pass !== confirm) {
            errorMessage.textContent = "Passwords do not match.";
            return;
        }

        if (localStorage.getItem("username") !== null) {
            errorMessage.textContent =
                "An account is already saved. Please login using your existing account.";
            return;
        }

        localStorage.setItem("username", user);
        localStorage.setItem("password", pass);

        alert("Account created successfully! Please login.");

        toggleForm();
        return;
    }

    // LOGIN
    const savedUsername = localStorage.getItem("username");
    const savedPassword = localStorage.getItem("password");

    if (
        savedUsername !== null &&
        user === savedUsername &&
        pass === savedPassword
    ) {
        // Save login status
        localStorage.setItem("isLoggedIn", "true");

        alert("Welcome! Successfully logged in.");

        // OPEN YOUR WEBSITE
        window.location.replace("./index.html");

    } else {
        errorMessage.textContent =
            "Invalid username or password. Please check your account.";
    }
});

            
    </script>

</body>
</html>
